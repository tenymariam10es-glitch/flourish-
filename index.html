<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee5fa"><title>Flourish</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>*{box-sizing:border-box}body{margin:auto;max-width:650px;padding:20px;background:#faf8f4;color:#514474;font:16px system-ui}h1{font-size:38px;margin:0}h2{font-size:21px}section,article{padding:16px;border-radius:20px;margin:12px 0;background:#eee5fa}button,input,select{font:inherit;border:1px solid #d8cce7;border-radius:12px;padding:12px;max-width:100%}button{background:#79639e;color:white;cursor:pointer}input,select{background:white;color:#514474;width:100%;margin:5px 0}nav{display:flex;gap:6px;flex-wrap:wrap}nav button{flex:1;padding:10px}#pots{display:grid;grid-template-columns:1fr 1fr;gap:10px}article{margin:0;cursor:pointer}small{display:block;color:#655b70}progress{width:100%;accent-color:#8870b0}strong{font-size:23px}label{display:block;margin-top:8px}.line{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}.line button{padding:6px} [hidden]{display:none!important}</style><header><small>YOUR WEALTH JOURNEY</small><h1>🌷 flourish.</h1><p>Grow your wealth. Grow your freedom.</p></header><nav><button onclick="show('home')">Home</button><button onclick="show('activity')">Activity</button><button onclick="show('game')">Missions</button><button onclick="show('settings')">Settings</button></nav><main id="home"><section><small>Monthly money remaining</small><strong id="remaining"></strong><p id="summary"></p><progress id="overall" max="100"></progress></section><section style="background:#fff0d5"><strong id="rank"></strong><p id="xp"></p></section><h2>My money pots</h2><div id="pots"></div><section id="entry"><h2>Add transaction</h2><select id="category"></select><input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount (£)"><input id="note" placeholder="Merchant or note"><input id="date" type="date"><button onclick="add()">Record transaction</button><p id="message" role="status"></p></section></main><main id="activity" hidden><h2>Money diary</h2><div id="records"></div></main><main id="game" hidden><section><h2>🌱 Your garden</h2><p id="gameinfo"></p><button onclick="review()">Complete monthly review (+50 XP)</button><p id="reward"></p></section><section><h2>Annual growth</h2><p id="annual"></p><progress id="annualbar" max="100"></progress></section></main><main id="settings" hidden><section><h2>Private setup</h2><label>Month<input id="month" type="month" onchange="changeMonth()"></label><label>Monthly income (£)<input id="income" type="number" min="0"></label><div id="budgets"></div><button onclick="saveBudget()">Save budget</button><p id="budgetstatus"></p></section><section><h2>Backup & restore</h2><button onclick="backup()">Export backup</button><label>Restore backup (replaces records)<input type="file" accept=".json" onchange="restore(event)"></label><p>Records stay in this browser. Export backups regularly. No bank connection.</p></section></main><script>
const names=['Rent','Car loan','Education loan','Parents','Charity','Gym','Groceries','Petrol','Eating out','Skincare','Shopping','Car costs','Travel','Miscellaneous','Savings','Investments'],icons=['🏠','🚗','🎓','💗','🤝','🏃','🥦','⛽','🍴','✨','🛍️','🔧','✈️','🪙','🌱','📈'],colors=['#e5e5fc','#e1edff','#eee4fc','#fce4ed','#fce8e1','#ffedd7','#e0f3e2','#dff1fa','#fff1cf','#f8e3ef','#efe3fa','#e4e9fa','#dcf3ef','#eeece8','#dff3e8','#e9e4ff'];const $=id=>document.getElementById(id),money=n=>n.toLocaleString('en-GB',{style:'currency',currency:'GBP'}),today=()=>new Date().toLocaleDateString('en-CA');let current=new Date().toISOString().slice(0,7),state={months:{},records:[]};try{let s=localStorage.getItem('flourish-v1');if(s)state=JSON.parse(s)}catch(e){alert('Saved data could not be read.')}function config(){return state.months[current]??={income:0,budgets:names.map(()=>0),review:false}}function persist(){try{localStorage.setItem('flourish-v1',JSON.stringify(state))}catch(e){alert('Storage failed. Export a backup now.')}}function show(id){document.querySelectorAll('main').forEach(x=>x.hidden=x.id!==id);if(id==='settings')setup();render()}function setup(){$('month').value=current;$('income').value=config().income;$('budgets').replaceChildren();names.forEach((n,i)=>{let l=document.createElement('label');l.textContent=n+' (£)';let x=document.createElement('input');x.type='number';x.min=0;x.step='.01';x.id='b'+i;x.value=config().budgets[i];l.append(x);$('budgets').append(l)})}function changeMonth(){if($('month').value){current=$('month').value;setup();render()}}function saveBudget(){let c=config();c.income=Math.max(0,Number($('income').value)||0);c.budgets=names.map((_,i)=>Math.max(0,Number($('b'+i).value)||0));persist();render();$('budgetstatus').textContent='Saved. Unallocated: '+money(c.income-c.budgets.reduce((a,b)=>a+b,0))}function add(){let v=Number($('amount').value),d=$('date').value;if(!(v>0&&Number.isFinite(v)&&d)){ $('message').textContent='Enter a valid amount and date.';return}state.records.push({id:Date.now()+Math.random(),i:Number($('category').value),v:Math.round(v*100)/100,d,n:$('note').value});current=d.slice(0,7);persist();$('amount').value='';$('note').value='';$('message').textContent='Recorded! 🌷';render()}function remove(id){if(confirm('Delete this transaction?')){state.records=state.records.filter(r=>r.id!==id);persist();render()}}function review(){config().review=true;persist();render()}function render(){let c=config(),rs=state.records.filter(r=>r.d.startsWith(current)),u=names.map((_,i)=>rs.filter(r=>r.i===i).reduce((a,r)=>a+r.v,0)),total=u.reduce((a,b)=>a+b,0),breaches=[8,10,12,13].filter(i=>u[i]>c.budgets[i]).length,xp=Math.max(0,Math.min(100,rs.length*10)+(c.review?50:0)+(c.budgets[14]>0&&u[14]>=c.budgets[14]?200:0)+(c.budgets[15]>0&&u[15]>=c.budgets[15]?100:0)-25*breaches);$('remaining').textContent=money(c.income-total);$('summary').textContent=current+' · Income '+money(c.income)+' · Recorded '+money(total);$('overall').value=Math.min(100,total/Math.max(1,c.income)*100);$('rank').textContent=xp>=250?'🌸 Flourishing':xp>=100?'🌿 Growing':'🌱 Little seed';$('xp').textContent=xp+' XP this month';$('pots').replaceChildren();names.forEach((n,i)=>{let a=document.createElement('article');a.style.background=colors[i];let title=document.createElement('div');title.textContent=icons[i]+' '+n;let s=document.createElement('strong');s.textContent=money(i>=14?Math.max(0,c.budgets[i]-u[i]):c.budgets[i]-u[i]);let p=document.createElement('progress');p.max=100;p.value=Math.min(100,u[i]/Math.max(.01,c.budgets[i])*100);let t=document.createElement('small');t.textContent=money(u[i])+' / '+money(c.budgets[i])+(i<14&&u[i]>c.budgets[i]?' · Over budget':i<14&&u[i]>0&&u[i]>=.8*c.budgets[i]?' · Near limit':i>=14?' · To goal':' · Available');a.append(title,s,p,t);a.onclick=()=>{$('category').value=i;$('entry').scrollIntoView({behavior:'smooth'})};$('pots').append(a)});$('records').replaceChildren();rs.slice().reverse().forEach(r=>{let a=document.createElement('section'),t=document.createElement('span'),b=document.createElement('button');a.className='line';t.textContent=r.d+' · '+names[r.i]+' · '+r.n+' · '+money(r.v);b.textContent='Delete';b.onclick=()=>remove(r.id);a.append(t,b);$('records').append(a)});$('gameinfo').textContent=xp+' XP · '+breaches+' discretionary budget breaches. Record transactions, reach savings goals and review your month.';$('reward').textContent=xp>=250?'🎁 Reward unlocked: enjoy a planned treat within your budget.':'Next reward at 250 XP. Essential spending is never penalised.';let yr=current.slice(0,4),saved=state.records.filter(r=>r.d.startsWith(yr)&&r.i>=14).reduce((a,r)=>a+r.v,0),goal=(c.budgets[14]+c.budgets[15])*12;$('annual').textContent=money(saved)+' / '+money(goal)+' (annualised current monthly target)';$('annualbar').value=Math.min(100,saved/Math.max(1,goal)*100)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='flourish-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(e){try{let s=JSON.parse(await e.target.files[0].text());if(!s.months||!Array.isArray(s.records)||!s.records.every(r=>Number.isInteger(r.i)&&r.i>=0&&r.i<16&&Number.isFinite(r.v)&&r.v>0&&typeof r.d==='string')||!Object.values(s.months).every(c=>Number.isFinite(c.income)&&Array.isArray(c.budgets)&&c.budgets.length===16&&c.budgets.every(v=>Number.isFinite(v)&&v>=0)))throw Error();if(confirm('Replace all current data?')){state=s;persist();setup();render()}}catch(e){alert('Invalid backup file.')}}names.forEach((n,i)=>$('category').add(new Option(n,i)));$('date').value=new Date().toISOString().slice(0,10);render();if(!config().income)show('settings');</script></html>
